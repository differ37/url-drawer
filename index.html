<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182c26">
  <meta name="referrer" content="no-referrer">
  <title>링크 서랍</title>
  <meta name="description" content="링크를 붙여넣고 카테고리별로 정리하는 개인 보관함">
  <style>
    :root {
      color-scheme: light;
      --ink: #20342d;
      --muted: #56665f;
      --green: #205f4c;
      --line: #dce4da;
      --paper: #f5f6ef;
      --white: #fffefa;
      font: 16px/1.55 "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; background: var(--paper); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid #bc711f;
      outline-offset: 3px;
    }

    .layout { min-height: 100vh; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
    .sidebar { background: #182c26; color: #f0f4e9; padding: 31px 23px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 12px; margin: 0 0 43px; font-size: 21px; font-weight: 800; letter-spacing: -.05em; }
    .brand-icon, .empty-icon { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 11px; }
    .brand-icon { background: #cde7a9; color: #1d3529; }
    .chain { position: relative; width: 23px; height: 22px; transform: rotate(-36deg); }
    .chain::before, .chain::after {
      content: ""; position: absolute; top: 7px; width: 13px; height: 8px;
      border: 2px solid currentColor; border-radius: 6px;
    }
    .chain::before { left: 0; }
    .chain::after { right: 0; }
    .nav-label { margin: 0 0 9px 10px; color: #b2c5ba; font-size: 12px; font-weight: 700; }
    #categories { display: grid; gap: 4px; }
    .nav-button {
      width: 100%; border: 0; border-radius: 8px; color: #e3eae0; background: transparent;
      display: flex; align-items: center; gap: 10px; padding: 9px 10px; text-align: left;
      font-size: 14px; white-space: nowrap;
    }
    .nav-button:hover { background: #273f36; }
    .nav-button[aria-pressed="true"] { background: #d8eac5; color: #23392d; font-weight: 750; }
    .nav-button .count { margin-inline-start: auto; opacity: .85; font-size: 12px; font-variant-numeric: tabular-nums; }
    .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--dot, #84ac95); }
    .local-label { display: flex; gap: 8px; align-items: center; margin: auto 0 0; padding-top: 36px; color: #b2c5ba; font-size: 12px; }

    main { width: min(100%, 1270px); padding: 49px clamp(24px, 5.2vw, 78px) 56px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(34px, 4.5vw, 52px); letter-spacing: -.068em; line-height: 1.13; }
    .overview { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 25px; }
    .overview p { margin-top: 9px; color: var(--muted); font-size: 14px; }
    .total { flex: none; color: var(--green); font-weight: 750; font-size: 13px; background: #e4edda; border-radius: 99px; padding: 6px 12px; }
    .capture { border-radius: 17px; background: #e8efdd; border: 1px solid #d7e2cd; padding: 23px 23px 18px; }
    h2 { font-size: 19px; letter-spacing: -.035em; line-height: 1.25; }
    .capture-fields { display: grid; grid-template-columns: minmax(0, 1fr) 130px auto; align-items: end; gap: 10px; margin: 15px 0 10px; }
    .field { display: grid; gap: 5px; min-width: 0; font-size: 12px; font-weight: 700; }
    .field input, .field select, .search input {
      width: 100%; border: 1px solid #cad7c6; border-radius: 9px; background: var(--white);
      color: var(--ink); padding: 10px 12px; min-height: 44px; font-size: 14px; font-weight: 500;
    }
    .field input::placeholder, .search input::placeholder { color: #63746b; }
    .primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
      min-height: 44px; padding: 9px 17px; border: 1px solid var(--green); border-radius: 9px;
      color: white; background: var(--green); font-size: 14px; font-weight: 750;
    }
    .primary:hover { background: #164837; }
    .plus { font-size: 19px; font-weight: 500; line-height: 1; }
    .capture-help { color: #4d6353; font-size: 12px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px 12px; }
    .toggle { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-weight: 750; }
    .toggle input { accent-color: var(--green); margin: 0; }
    #feedback { min-height: 20px; margin: 6px 2px 0; color: var(--muted); font-size: 13px; }
    #feedback.error { color: #9b3230; }

    .library { margin-top: 20px; }
    .library-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .search { position: relative; width: min(240px, 58%); }
    .search input { padding-left: 34px; min-height: 39px; }
    .search::before {
      content: ""; position: absolute; left: 13px; top: 12px; width: 10px; height: 10px;
      border: 1.5px solid var(--muted); border-radius: 50%; pointer-events: none;
    }
    .search::after {
      content: ""; position: absolute; left: 22px; top: 23px; width: 6px; height: 1.5px;
      background: var(--muted); transform: rotate(45deg); pointer-events: none;
    }
    .table-box { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--white); }
    table { width: 100%; table-layout: fixed; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 13px; }
    th { font-size: 12px; font-weight: 750; color: #52655a; background: #f1f4ed; }
    td { border-top: 1px solid #edf0e9; vertical-align: middle; font-size: 14px; }
    .col-number { width: 62px; }
    .col-url { width: 36%; }
    .col-category { width: 90px; }
    .col-actions { width: 123px; }
    .number { color: #53695d; font-size: 13px; font-variant-numeric: tabular-nums; }
    .link { color: var(--green); font-weight: 750; text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .url-detail { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .category-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 99px; background: #f0f3eb; font-size: 12px; white-space: nowrap; }
    .memo { overflow-wrap: anywhere; }
    .memo.placeholder { color: var(--muted); }
    .actions { display: flex; gap: 4px; justify-content: end; }
    .quiet { padding: 5px 7px; background: transparent; color: #3c5548; border: 1px solid transparent; border-radius: 6px; font-size: 12px; white-space: nowrap; }
    .quiet:hover { background: #edf2e8; }
    .delete:hover { color: #9b3230; background: #faece9; }
    .empty { text-align: center; border-top: 1px solid var(--line); padding: 44px 18px 49px; }
    .empty-icon { margin: 0 auto 10px; width: 48px; height: 48px; background: #ecf2e4; color: #416852; }
    .empty strong { display: block; font-size: 16px; }
    .empty p { color: var(--muted); font-size: 13px; margin-top: 5px; }
    [hidden] { display: none !important; }

    dialog { width: min(440px, calc(100% - 32px)); padding: 24px; border: 1px solid var(--line); border-radius: 15px; background: var(--white); color: var(--ink); }
    dialog::backdrop { background: #152b2485; }
    dialog .field { margin: 16px 0 20px; }
    .dialog-actions { display: flex; gap: 10px; justify-content: end; align-items: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); border: 0; }

    @media (max-width: 880px) {
      .layout { grid-template-columns: 170px minmax(0, 1fr); }
      .sidebar { padding-inline: 13px; }
      main { padding-inline: 24px; }
      .col-url { width: 29%; }
      .col-actions { width: 99px; }
      th, td { padding-inline: 9px; }
    }
    @media (max-width: 650px) {
      .layout { display: block; }
      .sidebar { padding: 15px 16px 9px; }
      .brand { margin: 0 0 11px; font-size: 18px; }
      .brand-icon { width: 30px; height: 30px; }
      .nav-label, .local-label { display: none; }
      #categories { display: flex; overflow: auto; padding: 4px 3px 7px; }
      .nav-button { width: auto; gap: 6px; padding: 7px 9px; font-size: 13px; }
      main { padding: 23px 16px 30px; }
      .capture { padding: 16px; }
      .capture-fields { grid-template-columns: minmax(0, 1fr) auto; }
      .field-url { grid-column: 1 / -1; }
      .capture-fields .primary { min-width: 100px; }
      .empty { padding: 34px 12px; }
      table, tbody { display: block; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      tbody tr { display: grid; grid-template-columns: 37px auto 1fr; gap: 5px 8px; padding: 12px; border-top: 1px solid var(--line); }
      tbody tr:first-child { border-top: 0; }
      td { border: 0; padding: 0; min-width: 0; }
      .number { grid-column: 1; grid-row: 1; align-self: center; }
      .url-cell { grid-column: 1 / -1; grid-row: 2; }
      .category-cell { grid-column: 2; grid-row: 1; align-self: center; }
      .memo { grid-column: 1 / -1; grid-row: 3; }
      .row-actions { grid-column: 3; grid-row: 1; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <p class="brand"><span class="brand-icon" aria-hidden="true"><span class="chain"></span></span>링크 서랍</p>
      <p class="nav-label">카테고리</p>
      <nav id="categories" aria-label="카테고리"></nav>
      <p class="local-label"><span class="dot" aria-hidden="true"></span>이 브라우저에 저장</p>
    </aside>
    <main>
      <header class="overview">
        <div>
          <h1>링크 보관함</h1>
          <p>링크를 모아두고, 필요할 때 다시 열어보세요.</p>
        </div>
        <span class="total" id="total">총 0개</span>
      </header>

      <section class="capture" aria-labelledby="capture-title">
        <h2 id="capture-title">새 링크 저장</h2>
        <form id="capture-form">
          <div class="capture-fields">
            <label class="field field-url">URL
              <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://… 붙여넣기" required>
            </label>
            <label class="field">카테고리
              <select id="category"></select>
            </label>
            <button class="primary" type="submit"><span class="plus" aria-hidden="true">+</span> 저장</button>
          </div>
          <div class="capture-help">
            <label class="toggle"><input id="auto-summary" type="checkbox" checked> 한 줄 메모 자동 작성</label>
            <span>공개 URL의 제목과 설명을 Microlink에서 가져옵니다.</span>
          </div>
        </form>
      </section>
      <p id="feedback" role="status" aria-live="polite"></p>

      <section class="library" aria-labelledby="library-title">
        <div class="library-heading">
          <h2 id="library-title">전체 링크</h2>
          <label class="search"><span class="sr-only">URL 또는 메모 검색</span>
            <input type="search" id="search" placeholder="URL 또는 메모 검색" autocomplete="off">
          </label>
        </div>
        <div class="table-box">
          <table id="library-table" aria-labelledby="library-title">
            <thead>
              <tr>
                <th scope="col" class="col-number">번호</th>
                <th scope="col" class="col-url">URL</th>
                <th scope="col" class="col-category">카테고리</th>
                <th scope="col">한 줄 메모</th>
                <th scope="col" class="col-actions"><span class="sr-only">작업</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div id="empty" class="empty">
            <span class="empty-icon" aria-hidden="true"><span class="chain"></span></span>
            <strong id="empty-title">저장된 링크가 없어요</strong>
            <p id="empty-help">위에 URL을 붙여넣고 카테고리를 골라 저장하세요.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <form id="edit-form">
      <h2 id="edit-title">한 줄 메모 수정</h2>
      <label class="field">메모
        <input id="memo-text" maxlength="180" autocomplete="off" autofocus>
      </label>
      <div class="dialog-actions">
        <button class="quiet" id="cancel-edit" type="button">취소</button>
        <button class="primary" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <script>
    "use strict";

    const categories = new Map([
      ["쿠파스", "#8bc48f"],
      ["움짤", "#f0b56c"],
      ["AI", "#9c9be4"],
      ["정보", "#83bdd7"],
      ["성인", "#d693ae"],
      ["운동", "#a7bb58"],
      ["기타", "#aeb9ac"],
    ]);
    const storeKey = "jj-link-drawer-v1";
    const $ = (id) => document.getElementById(id);
    const pending = new Set();
    let active = "전체";
    let editing = null;
    let loadFailed = false;
    let model = readStore();

    function readStore() {
      try {
        const saved = JSON.parse(localStorage.getItem(storeKey));
        return saved ?? { links: [], numbers: {}, autoSummary: true };
      } catch {
        loadFailed = true;
        return { links: [], numbers: {}, autoSummary: true };
      }
    }

    function save(next) {
      try {
        localStorage.setItem(storeKey, JSON.stringify(next));
        model = next;
        return true;
      } catch {
        feedback("브라우저 저장 공간을 사용할 수 없어요. 저장되지 않았습니다.", true);
        return false;
      }
    }

    function feedback(message, error = false) {
      $("feedback").textContent = message;
      $("feedback").classList.toggle("error", error);
    }

    function validUrl(text) {
      const input = text.trim();
      const normalized = /^(?:[a-z\d-]+\.)+[a-z\d-]+(?::\d+)?(?:[/?#]|$)/i.test(input)
        ? "https://" + input : input;
      try {
        const url = new URL(normalized);
        if (!["http:", "https:"].includes(url.protocol) || url.username || url.password) return null;
        return url;
      } catch {
        return null;
      }
    }

    function lookupUrl(url) {
      const copy = new URL(url.href);
      const host = copy.hostname.toLowerCase().replace(/\.$/, "");
      const privateHosts = ["localhost", "local", "internal", "test", "docs.google.com", "drive.google.com",
        "notion.so", "notion.com", "app.notion.com", "dropbox.com", "1drv.ms", "icloud.com"];
      if (!host.includes(".") || /^[\d.]+$/.test(host) ||
          privateHosts.some((domain) => host === domain || host.endsWith("." + domain))) return null;
      for (const key of copy.searchParams.keys()) {
        if (/token|secret|auth|session|password|credential|signature|api.?key|^key$|^sig$|^code$|^invite$/i.test(key)) return null;
      }
      if (/\/(login|signin|invite|reset-password|magic-link|oauth)(\/|$)/i.test(copy.pathname)) return null;
      copy.hash = "";
      const kept = new Set(["v", "t", "id", "itemId", "productId", "vendorItemId"]);
      for (const key of new Set(copy.searchParams.keys())) {
        if (!kept.has(key)) copy.searchParams.delete(key);
      }
      return copy.href;
    }

    function oneLine(metadata) {
      const compact = (value) => typeof value === "string" ? value.replace(/\s+/g, " ").trim() : "";
      const usable = (value) => value && !/^(access denied|forbidden|just a moment|sign in|log in|로그인|robot check|403 forbidden)\b/i.test(value);
      const description = compact(metadata.description);
      const title = compact(metadata.title);
      const sentence = description.match(/^(.{12,150}?[.!?。！？])(?:\s|$)/u)?.[1] ?? description;
      const summary = usable(sentence) && sentence.length >= 14 ? sentence : usable(title) ? title : "";
      return summary.length > 125 ? summary.slice(0, 122).trimEnd() + "…" : summary;
    }

    async function summarize(id, address) {
      try {
        const endpoint = new URL("https://api.microlink.io/");
        endpoint.search = new URLSearchParams({ url: address, filter: "title,description" });
        const response = await fetch(endpoint, { signal: AbortSignal.timeout(12000), credentials: "omit", referrerPolicy: "no-referrer" });
        if (!response.ok) return;
        const payload = await response.json();
        const memo = payload.status === "success" ? oneLine(payload.data ?? {}) : "";
        const current = readStore();
        if (memo && current.links.some((entry) => entry.id === id && !entry.memo && !entry.memoEdited)) {
          save({ ...current, links: current.links.map((entry) => entry.id === id ? { ...entry, memo } : entry) });
        }
      } catch {
        // A blocked page or an unavailable preview does not prevent saving.
      } finally {
        pending.delete(id);
        render();
      }
    }

    function make(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function categoryDot(category) {
      const dot = make("span", "dot");
      dot.setAttribute("aria-hidden", "true");
      dot.style.setProperty("--dot", categories.get(category) ?? "#84ac95");
      return dot;
    }

    function renderNav() {
      for (const button of $("categories").querySelectorAll("button")) {
        const category = button.dataset.category;
        const count = category === "전체" ? model.links.length : model.links.filter((entry) => entry.category === category).length;
        button.setAttribute("aria-pressed", category === active);
        button.querySelector(".count").textContent = count;
      }
    }

    function renderRow(entry) {
      const row = make("tr");
      const number = make("td", "number", "#" + entry.number);
      const urlCell = make("td", "url-cell");
      const href = validUrl(entry.url);
      const link = make("a", "link", href?.hostname.replace(/^www\./, "") ?? entry.url);
      if (href) link.href = href.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.title = entry.url;
      urlCell.append(link, make("span", "url-detail", entry.url));

      const category = make("td", "category-cell");
      const pill = make("span", "category-pill");
      pill.append(categoryDot(entry.category), entry.category);
      category.append(pill);

      const placeholder = pending.has(entry.id) ? "메모 작성 중…" : "메모 추가 가능";
      const memo = make("td", entry.memo ? "memo" : "memo placeholder", entry.memo || placeholder);
      const actionsCell = make("td", "row-actions");
      const actions = make("div", "actions");
      const edit = make("button", "quiet", "수정");
      edit.type = "button";
      edit.setAttribute("aria-label", entry.category + " " + entry.number + "번 메모 수정");
      edit.addEventListener("click", () => {
        editing = entry.id;
        $("memo-text").value = entry.memo;
        $("edit-dialog").showModal();
      });
      const remove = make("button", "quiet delete", "삭제");
      remove.type = "button";
      remove.setAttribute("aria-label", entry.category + " " + entry.number + "번 링크 삭제");
      remove.addEventListener("click", () => {
        if (!confirm(entry.category + " " + entry.number + "번 링크를 삭제할까요?")) return;
        const current = readStore();
        if (save({ ...current, links: current.links.filter((item) => item.id !== entry.id) })) {
          feedback("링크를 삭제했어요.");
          render();
        }
      });
      actions.append(edit, remove);
      actionsCell.append(actions);
      row.append(number, urlCell, category, memo, actionsCell);
      return row;
    }

    function render() {
      const query = $("search").value.trim().toLowerCase();
      const entries = model.links.filter((entry) =>
        (active === "전체" || entry.category === active) &&
        (!query || [entry.url, entry.memo, entry.category].some((value) => value.toLowerCase().includes(query)))
      );
      $("total").textContent = "총 " + model.links.length + "개";
      $("library-title").textContent = active + (active === "전체" ? " 링크" : " 보관함");
      $("rows").replaceChildren(...entries.map(renderRow));
      $("library-table").hidden = entries.length === 0 && matchMedia("(max-width: 650px)").matches;
      $("empty").hidden = entries.length > 0;
      $("empty-title").textContent = query ? "검색 결과가 없어요" : "저장된 링크가 없어요";
      $("empty-help").textContent = query ? "다른 URL이나 메모로 검색해 보세요." : "위에 URL을 붙여넣고 카테고리를 골라 저장하세요.";
      renderNav();
    }

    for (const category of ["전체", ...categories.keys()]) {
      const button = make("button", "nav-button");
      button.type = "button";
      button.dataset.category = category;
      button.append(categoryDot(category), make("span", "", category), make("span", "count", "0"));
      button.addEventListener("click", () => {
        active = category;
        if (category !== "전체") $("category").value = category;
        render();
      });
      $("categories").append(button);
      if (category !== "전체") $("category").add(new Option(category, category));
    }

    $("auto-summary").checked = model.autoSummary;
    $("auto-summary").addEventListener("change", () => {
      if (!save({ ...readStore(), autoSummary: $("auto-summary").checked })) $("auto-summary").checked = model.autoSummary;
    });

    $("capture-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const url = validUrl($("url").value);
      if (!url) {
        feedback("올바른 웹 주소를 붙여넣어 주세요.", true);
        $("url").focus();
        return;
      }
      const category = $("category").value;
      const current = readStore();
      if (loadFailed) {
        feedback("기존 저장 내용을 읽을 수 없어요. 브라우저 저장 설정을 확인해 주세요.", true);
        return;
      }
      if (current.links.some((entry) => entry.category === category && entry.url === url.href)) {
        feedback("이 카테고리에 이미 저장된 링크예요.", true);
        return;
      }
      const number = (current.numbers[category] ?? 0) + 1;
      const id = crypto.randomUUID();
      const entry = { id, number, category, url: url.href, memo: "" };
      const next = { ...current, numbers: { ...current.numbers, [category]: number }, links: [entry, ...current.links] };
      if (!save(next)) return;
      const address = current.autoSummary ? lookupUrl(url) : null;
      if (address) pending.add(id);
      if (active !== "전체") active = category;
      $("url").value = "";
      $("search").value = "";
      feedback(category + " " + number + "번에 저장했어요.");
      render();
      if (address) void summarize(id, address);
    });

    $("edit-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const current = readStore();
      const memo = $("memo-text").value.trim();
      const links = current.links.map((entry) => entry.id === editing ? { ...entry, memo, memoEdited: true } : entry);
      if (save({ ...current, links })) {
        $("edit-dialog").close();
        feedback("메모를 저장했어요.");
        render();
      }
    });
    $("cancel-edit").addEventListener("click", () => $("edit-dialog").close());
    $("search").addEventListener("input", render);
    window.addEventListener("storage", (event) => {
      if (event.key === storeKey || event.key === null) {
        model = readStore();
        $("auto-summary").checked = model.autoSummary;
        render();
      }
    });

    if (loadFailed) feedback("이 브라우저에 저장된 링크를 읽지 못했어요.", true);
    render();
  </script>
</body>
</html>
