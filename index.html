<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0e0f">
  <meta name="referrer" content="no-referrer">
  <meta name="google-sync-client-id" content="758564020397-k0bparvcp75iv5f1dg6741j120cr2p9o.apps.googleusercontent.com">
  <title>링크 서랍</title>
  <meta name="description" content="링크를 붙여넣고 카테고리별로 정리하는 개인 보관함">
  <style>
    @font-face {
      font-family: Paperlogy;
      src: url("https://cdn.jsdelivr.net/gh/Freesentation/paperlogy@8ef35f53b318c7ca914c52b1b382b9a8bad07a61/woff2/Paperlogy-4Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: Paperlogy;
      src: url("https://cdn.jsdelivr.net/gh/Freesentation/paperlogy@8ef35f53b318c7ca914c52b1b382b9a8bad07a61/woff2/Paperlogy-7Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --canvas: #0e0e0f;
      --rail: #121213;
      --card: #181819;
      --card-top: #1f1f21;
      --input: #111112;
      --line: #303033;
      --fine-line: #262628;
      --ink: #f4f4f3;
      --muted: #a7a7ac;
      --hover: #262628;
      --accent: #f2f2ef;
      --on-accent: #151516;
      --primary-hover: #dcdcd8;
      --danger: #ffaca6;
      --danger-bg: #392121;
      --shadow: 0 18px 45px #0003;
      font: 16px/1.55 Paperlogy, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --canvas: #fbfbfa;
      --rail: #f4f4f3;
      --card: #fff;
      --card-top: #f8f8f7;
      --input: #fff;
      --line: #d9d9d8;
      --fine-line: #e9e9e8;
      --ink: #171718;
      --muted: #58585d;
      --hover: #ebebea;
      --accent: #1a1a1c;
      --on-accent: #fff;
      --primary-hover: #37373a;
      --danger: #a52b26;
      --danger-bg: #faeeed;
      --shadow: 0 18px 42px #2424240a;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; background: var(--canvas); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--muted);
      outline-offset: 3px;
    }

    .layout { min-height: 100vh; display: grid; grid-template-columns: 222px minmax(0, 1fr); }
    .sidebar {
      background: var(--rail); border-right: 1px solid var(--fine-line);
      padding: 28px 18px; display: flex; flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin: 0 0 42px 6px; font-size: 19px; font-weight: 700; letter-spacing: -.04em; }
    .brand-icon, .empty-icon { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 10px; }
    .brand-icon { background: var(--accent); color: var(--on-accent); }
    .chain { position: relative; width: 24px; height: 22px; transform: rotate(-36deg); }
    .chain::before, .chain::after {
      content: ""; position: absolute; top: 7px; width: 13px; height: 8px;
      border: 2px solid currentColor; border-radius: 6px;
    }
    .chain::before { left: 1px; }
    .chain::after { right: 1px; }
    .nav-label { margin: 0 0 10px 11px; color: var(--muted); font-size: 11px; font-weight: 700; }
    #categories { display: grid; gap: 5px; }
    .nav-button {
      width: 100%; border: 1px solid transparent; border-radius: 9px; color: var(--muted); background: transparent;
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; text-align: left;
      font-size: 13px; white-space: nowrap; min-height: 40px;
    }
    .nav-button:hover { background: var(--hover); color: var(--ink); }
    .nav-button[aria-pressed="true"] { background: var(--card-top); border-color: var(--line); color: var(--ink); font-weight: 700; }
    .nav-button .count { margin-inline-start: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--dot, var(--muted)); }
    .local-label { display: flex; gap: 8px; align-items: center; margin: auto 6px 0; padding-top: 35px; color: var(--muted); font-size: 11px; }

    main { width: min(100%, 1240px); padding: 38px clamp(22px, 4.6vw, 72px) 58px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(33px, 4vw, 49px); letter-spacing: -.065em; line-height: 1.13; }
    h2 { font-size: 19px; letter-spacing: -.04em; line-height: 1.25; }
    .overview { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 25px; }
    .overview-tools { display: flex; align-items: center; gap: 9px; }
    .total, .theme-button {
      display: inline-flex; align-items: center; gap: 7px; flex: none; color: var(--muted);
      background: var(--card); border: 1px solid var(--line); border-radius: 99px;
      padding: 7px 11px; font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .theme-button:hover { background: var(--hover); color: var(--ink); }
    .theme-symbol { width: 14px; font: 18px/1 system-ui, sans-serif; text-align: center; }
    .sync-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 7px 12px; margin: -9px 0 17px; }
    .sync-button {
      padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--card); color: var(--ink); font-size: 12px; font-weight: 700;
    }
    .sync-button:hover:not(:disabled) { background: var(--hover); }
    .sync-button:disabled { opacity: .7; cursor: wait; }
    #sync-status { color: var(--muted); font-size: 11px; }
    .capture {
      border-radius: 17px; background: linear-gradient(130deg, var(--card-top), var(--card) 62%);
      border: 1px solid var(--line); padding: 22px; box-shadow: var(--shadow);
    }
    .capture-fields {
      display: grid; grid-template-columns: minmax(0, 1fr) 136px auto;
      align-items: end; gap: 10px; margin: 17px 0 0;
    }
    .field { display: grid; gap: 6px; min-width: 0; color: var(--muted); font-size: 12px; font-weight: 700; }
    .field input, .field select, .search input {
      width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--input);
      color: var(--ink); padding: 10px 12px; min-height: 43px; font-size: 14px; font-weight: 400;
    }
    .field input::placeholder, .search input::placeholder { color: var(--muted); }
    .field input:disabled { opacity: .55; }
    .primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
      min-height: 43px; padding: 9px 17px; border: 1px solid transparent; border-radius: 9px;
      color: var(--on-accent); background: var(--accent); font-size: 14px; font-weight: 700;
    }
    .primary:hover { background: var(--primary-hover); }
    .plus { font: 19px/1 system-ui, sans-serif; }
    .product-section { margin-top: 12px; }
    .product-fields { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
    .product-none {
      min-height: 43px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px;
      color: var(--muted); background: var(--card); font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .product-none:hover { background: var(--hover); color: var(--ink); }
    .product-none[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
    .capture-help { margin-top: 15px; color: var(--muted); font-size: 11px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px 12px; }
    .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); font-weight: 700; }
    .toggle input { accent-color: var(--accent); margin: 0; }
    #feedback { min-height: 20px; margin: 7px 2px 0; color: var(--muted); font-size: 12px; }
    #feedback.error, #edit-feedback { color: var(--danger); }

    .library { margin-top: 17px; }
    .library-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .search { position: relative; width: min(251px, 55%); }
    .search input { padding-left: 34px; min-height: 38px; font-size: 12px; }
    .search::before {
      content: ""; position: absolute; left: 13px; top: 11px; width: 9px; height: 9px;
      border: 1.5px solid var(--muted); border-radius: 50%; pointer-events: none;
    }
    .search::after {
      content: ""; position: absolute; left: 22px; top: 21px; width: 6px; height: 1.5px;
      background: var(--muted); transform: rotate(45deg); pointer-events: none;
    }
    .table-box { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
    table { width: 100%; table-layout: fixed; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 13px; }
    th { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--card-top); }
    td { border-top: 1px solid var(--fine-line); vertical-align: middle; font-size: 13px; }
    .col-number { width: 61px; }
    .col-url { width: 34%; }
    .col-category { width: 91px; }
    .col-actions { width: 110px; }
    .number { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .link, .product-link { color: var(--ink); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .url-detail { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .product-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 11px; }
    .product-link::after { content: "↗"; font: 12px/1 system-ui, sans-serif; }
    .product-missing { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .category-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 99px; background: var(--card-top); font-size: 11px; white-space: nowrap; }
    .memo { overflow-wrap: anywhere; }
    .memo.placeholder { color: var(--muted); }
    .actions { display: flex; gap: 4px; justify-content: end; }
    .quiet { padding: 5px 7px; background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 6px; font-size: 12px; white-space: nowrap; }
    .quiet:hover { background: var(--hover); color: var(--ink); }
    .delete:hover { color: var(--danger); background: var(--danger-bg); }
    .empty { text-align: center; border-top: 1px solid var(--line); padding: 40px 18px 45px; }
    .empty-icon { margin: 0 auto 11px; width: 46px; height: 46px; border: 1px solid var(--line); background: var(--card-top); color: var(--muted); }
    .empty strong { display: block; font-size: 15px; }
    .empty p { color: var(--muted); font-size: 12px; margin-top: 5px; }
    [hidden] { display: none !important; }

    dialog { width: min(480px, calc(100% - 32px)); padding: 23px; border: 1px solid var(--line); border-radius: 15px; background: var(--card); color: var(--ink); }
    dialog::backdrop { background: #0009; }
    dialog form > .field { margin-top: 16px; }
    #edit-feedback { margin-top: 10px; font-size: 12px; }
    #edit-feedback:empty { display: none; }
    .dialog-actions { display: flex; gap: 10px; justify-content: end; align-items: center; margin-top: 18px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); border: 0; }

    @media (max-width: 880px) {
      .layout { grid-template-columns: 164px minmax(0, 1fr); }
      .sidebar { padding-inline: 12px; }
      main { padding-inline: 23px; }
      .col-url { width: 29%; }
      .col-actions { width: 92px; }
      th, td { padding-inline: 8px; }
    }
    @media (max-width: 650px) {
      .layout { display: block; }
      .sidebar { padding: 14px 13px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { margin: 0 0 10px 3px; font-size: 16px; }
      .brand-icon { width: 30px; height: 30px; }
      .nav-label, .local-label { display: none; }
      #categories { display: flex; overflow: auto; padding: 4px 3px 7px; }
      .nav-button { width: auto; gap: 6px; min-height: 34px; padding: 6px 8px; font-size: 12px; }
      main { padding: 21px 14px 30px; }
      .overview { align-items: center; margin-bottom: 17px; }
      h1 { font-size: clamp(25px, 6.4vw, 38px); white-space: nowrap; }
      .overview-tools { gap: 5px; }
      .total, .theme-button { padding: 6px 7px; font-size: 10px; }
      .theme-symbol { width: 12px; font-size: 14px; }
      .capture { padding: 15px; }
      .capture-fields { grid-template-columns: minmax(0, 1fr) auto; }
      .field-url { grid-column: 1 / -1; }
      .capture-fields .primary { min-width: 86px; }
      .empty { padding: 31px 12px; }
      table, tbody { display: block; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      tbody tr { display: grid; grid-template-columns: 35px auto 1fr; gap: 6px 8px; padding: 11px; border-top: 1px solid var(--line); }
      tbody tr:first-child { border-top: 0; }
      td { border: 0; padding: 0; min-width: 0; }
      .number { grid-column: 1; grid-row: 1; align-self: center; }
      .url-cell { grid-column: 1 / -1; grid-row: 2; }
      .category-cell { grid-column: 2; grid-row: 1; align-self: center; }
      .memo { grid-column: 1 / -1; grid-row: 3; }
      .row-actions { grid-column: 3; grid-row: 1; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <p class="brand"><span class="brand-icon" aria-hidden="true"><span class="chain"></span></span>링크 서랍</p>
      <p class="nav-label">카테고리</p>
      <nav id="categories" aria-label="카테고리"></nav>
      <p class="local-label"><span class="dot" aria-hidden="true"></span>이 브라우저에 저장</p>
    </aside>
    <main>
      <header class="overview">
        <h1>링크 보관함</h1>
        <div class="overview-tools">
          <span class="total" id="total">총 0개</span>
          <button class="theme-button" id="theme-switch" type="button">
            <span class="theme-symbol" id="theme-symbol" aria-hidden="true">☼</span>
            <span id="theme-label">화이트</span>
          </button>
        </div>
      </header>

      <div class="sync-strip" id="sync-controls" hidden>
        <button class="sync-button" id="drive-sync" type="button">Google Drive 연결</button>
        <span id="sync-status" role="status" aria-live="polite"></span>
      </div>

      <section class="capture" aria-labelledby="capture-title">
        <h2 id="capture-title">새 링크 저장</h2>
        <form id="capture-form">
          <div class="capture-fields">
            <label class="field field-url">URL
              <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://… 붙여넣기" required>
            </label>
            <label class="field">카테고리
              <select id="category"></select>
            </label>
            <button class="primary" type="submit"><span class="plus" aria-hidden="true">+</span> 저장</button>
          </div>
          <div class="product-section product-fields" id="capture-product" hidden>
            <label class="field">쿠팡 상품 링크 (선택)
              <input id="product-url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="쿠팡 상품 주소 붙여넣기">
            </label>
            <button class="product-none" id="product-none" type="button" aria-pressed="false">없음</button>
          </div>
          <div class="capture-help">
            <label class="toggle"><input id="auto-summary" type="checkbox" checked> 한 줄 메모 자동 작성</label>
            <span>공개 URL의 제목과 설명을 Microlink에서 가져옵니다.</span>
          </div>
        </form>
      </section>
      <p id="feedback" role="status" aria-live="polite"></p>

      <section class="library" aria-labelledby="library-title">
        <div class="library-heading">
          <h2 id="library-title">전체 링크</h2>
          <label class="search"><span class="sr-only">URL 또는 메모 검색</span>
            <input type="search" id="search" placeholder="URL 또는 메모 검색" autocomplete="off">
          </label>
        </div>
        <div class="table-box">
          <table id="library-table" aria-labelledby="library-title">
            <thead>
              <tr>
                <th scope="col" class="col-number">번호</th>
                <th scope="col" class="col-url">URL</th>
                <th scope="col" class="col-category">카테고리</th>
                <th scope="col">한 줄 메모</th>
                <th scope="col" class="col-actions"><span class="sr-only">작업</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div id="empty" class="empty">
            <span class="empty-icon" aria-hidden="true"><span class="chain"></span></span>
            <strong id="empty-title">저장된 링크가 없어요</strong>
            <p id="empty-help">위에 URL을 붙여넣고 카테고리를 골라 저장하세요.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <form id="edit-form">
      <h2 id="edit-title">링크 정보 수정</h2>
      <label class="field">메모
        <input id="memo-text" maxlength="180" autocomplete="off" autofocus>
      </label>
      <div class="product-section product-fields" id="edit-product" hidden>
        <label class="field">쿠팡 상품 링크 (선택)
          <input id="edit-product-url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="쿠팡 상품 주소 붙여넣기">
        </label>
        <button class="product-none" id="edit-product-none" type="button" aria-pressed="false">없음</button>
      </div>
      <p id="edit-feedback" role="status" aria-live="polite"></p>
      <div class="dialog-actions">
        <button class="quiet" id="cancel-edit" type="button">취소</button>
        <button class="primary" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { createDriveSync } from "./drive-sync.js?v=2";

    const categories = new Map([
      ["쿠파스", "#8bc48f"],
      ["움짤", "#f0b56c"],
      ["AI", "#9c9be4"],
      ["정보", "#83bdd7"],
      ["성인", "#d693ae"],
      ["운동", "#a7bb58"],
      ["기타", "#aeb9ac"],
    ]);
    const storeKey = "jj-link-drawer-v1";
    const $ = (id) => document.getElementById(id);
    const pending = new Set();
    let active = "전체";
    let editing = null;
    let loadFailed = false;
    let model = readStore();

    function readStore() {
      try {
        const saved = JSON.parse(localStorage.getItem(storeKey));
        return saved ?? { links: [], numbers: {}, autoSummary: true };
      } catch {
        loadFailed = true;
        return { links: [], numbers: {}, autoSummary: true };
      }
    }

    function save(next, fromDrive = false) {
      try {
        localStorage.setItem(storeKey, JSON.stringify(next));
        model = next;
        if (!fromDrive) driveSync.queue();
        return true;
      } catch {
        feedback("브라우저 저장 공간을 사용할 수 없어요. 저장되지 않았습니다.", true);
        return false;
      }
    }

    function feedback(message, error = false) {
      $("feedback").textContent = message;
      $("feedback").classList.toggle("error", error);
    }

    function renderTheme() {
      const light = model.theme === "light";
      document.documentElement.dataset.theme = light ? "light" : "dark";
      document.querySelector('meta[name="theme-color"]').content = light ? "#fbfbfa" : "#0e0e0f";
      $("theme-symbol").textContent = light ? "☾" : "☼";
      $("theme-label").textContent = light ? "다크" : "화이트";
      $("theme-switch").setAttribute("aria-label", light ? "다크 테마로 전환" : "화이트 테마로 전환");
    }

    function setProductNone(input, button, absent) {
      if (absent) input.value = "";
      input.disabled = absent;
      button.setAttribute("aria-pressed", absent);
    }

    function bindProductNone(input, button) {
      button.addEventListener("click", () => {
        const absent = !input.disabled;
        setProductNone(input, button, absent);
        if (!absent) input.focus();
      });
    }

    function validUrl(text) {
      const input = text.trim();
      const normalized = /^(?:[a-z\d-]+\.)+[a-z\d-]+(?::\d+)?(?:[/?#]|$)/i.test(input)
        ? "https://" + input : input;
      try {
        const url = new URL(normalized);
        if (!["http:", "https:"].includes(url.protocol) || url.username || url.password) return null;
        return url;
      } catch {
        return null;
      }
    }

    function lookupUrl(url) {
      const copy = new URL(url.href);
      const host = copy.hostname.toLowerCase().replace(/\.$/, "");
      const privateHosts = ["localhost", "local", "internal", "test", "docs.google.com", "drive.google.com",
        "notion.so", "notion.com", "app.notion.com", "dropbox.com", "1drv.ms", "icloud.com"];
      if (!host.includes(".") || /^[\d.]+$/.test(host) ||
          privateHosts.some((domain) => host === domain || host.endsWith("." + domain))) return null;
      for (const key of copy.searchParams.keys()) {
        if (/token|secret|auth|session|password|credential|signature|api.?key|^key$|^sig$|^code$|^invite$/i.test(key)) return null;
      }
      if (/\/(login|signin|invite|reset-password|magic-link|oauth)(\/|$)/i.test(copy.pathname)) return null;
      copy.hash = "";
      const kept = new Set(["v", "t", "id", "itemId", "productId", "vendorItemId"]);
      for (const key of new Set(copy.searchParams.keys())) {
        if (!kept.has(key)) copy.searchParams.delete(key);
      }
      return copy.href;
    }

    function oneLine(metadata) {
      const compact = (value) => typeof value === "string" ? value.replace(/\s+/g, " ").trim() : "";
      const usable = (value) => value && !/^(access denied|forbidden|just a moment|sign in|log in|로그인|robot check|403 forbidden)\b/i.test(value);
      const description = compact(metadata.description);
      const title = compact(metadata.title);
      const sentence = description.match(/^(.{12,150}?[.!?。！？])(?:\s|$)/u)?.[1] ?? description;
      const summary = usable(sentence) && sentence.length >= 14 ? sentence : usable(title) ? title : "";
      return summary.length > 125 ? summary.slice(0, 122).trimEnd() + "…" : summary;
    }

    async function summarize(id, address) {
      try {
        const endpoint = new URL("https://api.microlink.io/");
        endpoint.search = new URLSearchParams({ url: address, filter: "title,description" });
        const response = await fetch(endpoint, { signal: AbortSignal.timeout(12000), credentials: "omit", referrerPolicy: "no-referrer" });
        if (!response.ok) return;
        const payload = await response.json();
        const memo = payload.status === "success" ? oneLine(payload.data ?? {}) : "";
        const current = readStore();
        if (memo && current.links.some((entry) => entry.id === id && !entry.memo && !entry.memoEdited)) {
          save({ ...current, links: current.links.map((entry) => entry.id === id ? { ...entry, memo } : entry) });
        }
      } catch {
        // A blocked page or an unavailable preview does not prevent saving.
      } finally {
        pending.delete(id);
        render();
      }
    }

    function make(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function categoryDot(category) {
      const dot = make("span", "dot");
      dot.setAttribute("aria-hidden", "true");
      dot.style.setProperty("--dot", categories.get(category) ?? "#84ac95");
      return dot;
    }

    function renderNav() {
      for (const button of $("categories").querySelectorAll("button")) {
        const category = button.dataset.category;
        const count = category === "전체" ? model.links.length : model.links.filter((entry) => entry.category === category).length;
        button.setAttribute("aria-pressed", category === active);
        button.querySelector(".count").textContent = count;
      }
    }

    function renderRow(entry) {
      const row = make("tr");
      const number = make("td", "number", "#" + entry.number);
      const urlCell = make("td", "url-cell");
      const href = validUrl(entry.url);
      const link = make("a", "link", href?.hostname.replace(/^www\./, "") ?? entry.url);
      if (href) link.href = href.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.title = entry.url;
      urlCell.append(link, make("span", "url-detail", entry.url));
      const product = entry.category === "쿠파스" && entry.productUrl ? validUrl(entry.productUrl) : null;
      if (product) {
        const productLink = make("a", "product-link", "쿠팡 상품");
        productLink.href = product.href;
        productLink.target = "_blank";
        productLink.rel = "noopener noreferrer";
        productLink.title = product.href;
        urlCell.append(productLink);
      } else if (entry.category === "쿠파스" && entry.productUrl === null) {
        urlCell.append(make("span", "product-missing", "쿠팡 상품 없음"));
      }

      const category = make("td", "category-cell");
      const pill = make("span", "category-pill");
      pill.append(categoryDot(entry.category), entry.category);
      category.append(pill);

      const placeholder = pending.has(entry.id) ? "메모 작성 중…" : "메모 추가 가능";
      const memo = make("td", entry.memo ? "memo" : "memo placeholder", entry.memo || placeholder);
      const actionsCell = make("td", "row-actions");
      const actions = make("div", "actions");
      const edit = make("button", "quiet", "수정");
      edit.type = "button";
      edit.setAttribute("aria-label", entry.category + " " + entry.number + "번 정보 수정");
      edit.addEventListener("click", () => {
        editing = { id: entry.id, memo: entry.memo };
        $("memo-text").value = entry.memo;
        $("edit-product").hidden = entry.category !== "쿠파스";
        $("edit-product-url").value = entry.productUrl ?? "";
        setProductNone($("edit-product-url"), $("edit-product-none"), entry.productUrl === null);
        $("edit-feedback").textContent = "";
        $("edit-dialog").showModal();
      });
      const remove = make("button", "quiet delete", "삭제");
      remove.type = "button";
      remove.setAttribute("aria-label", entry.category + " " + entry.number + "번 링크 삭제");
      remove.addEventListener("click", () => {
        if (!confirm(entry.category + " " + entry.number + "번 링크를 삭제할까요?")) return;
        const current = readStore();
        if (save({ ...current, links: current.links.filter((item) => item.id !== entry.id) })) {
          feedback("링크를 삭제했어요.");
          render();
        }
      });
      actions.append(edit, remove);
      actionsCell.append(actions);
      row.append(number, urlCell, category, memo, actionsCell);
      return row;
    }

    function render() {
      const query = $("search").value.trim().toLowerCase();
      const entries = model.links.filter((entry) =>
        (active === "전체" || entry.category === active) &&
        (!query || [entry.url, entry.memo, entry.category, entry.productUrl ?? ""]
          .some((value) => value.toLowerCase().includes(query)))
      );
      $("total").textContent = "총 " + model.links.length + "개";
      $("library-title").textContent = active + (active === "전체" ? " 링크" : " 보관함");
      $("rows").replaceChildren(...entries.map(renderRow));
      $("library-table").hidden = entries.length === 0 && matchMedia("(max-width: 650px)").matches;
      $("empty").hidden = entries.length > 0;
      $("empty-title").textContent = query ? "검색 결과가 없어요" : "저장된 링크가 없어요";
      $("empty-help").textContent = query ? "다른 URL이나 메모로 검색해 보세요." : "위에 URL을 붙여넣고 카테고리를 골라 저장하세요.";
      renderNav();
    }

    for (const category of ["전체", ...categories.keys()]) {
      const button = make("button", "nav-button");
      button.type = "button";
      button.dataset.category = category;
      button.append(categoryDot(category), make("span", "", category), make("span", "count", "0"));
      button.addEventListener("click", () => {
        active = category;
        if (category !== "전체") $("category").value = category;
        $("capture-product").hidden = $("category").value !== "쿠파스";
        render();
      });
      $("categories").append(button);
      if (category !== "전체") $("category").add(new Option(category, category));
    }

    $("capture-product").hidden = $("category").value !== "쿠파스";
    $("category").addEventListener("change", () => {
      $("capture-product").hidden = $("category").value !== "쿠파스";
    });
    bindProductNone($("product-url"), $("product-none"));
    bindProductNone($("edit-product-url"), $("edit-product-none"));
    $("theme-switch").addEventListener("click", () => {
      const current = readStore();
      const theme = current.theme === "light" ? "dark" : "light";
      if (save({ ...current, theme })) renderTheme();
    });
    $("auto-summary").checked = model.autoSummary;
    $("auto-summary").addEventListener("change", () => {
      if (!save({ ...readStore(), autoSummary: $("auto-summary").checked })) $("auto-summary").checked = model.autoSummary;
    });

    $("capture-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const url = validUrl($("url").value);
      if (!url) {
        feedback("올바른 웹 주소를 붙여넣어 주세요.", true);
        $("url").focus();
        return;
      }
      const category = $("category").value;
      const productInput = $("product-url");
      const productText = category === "쿠파스" && !productInput.disabled ? productInput.value.trim() : "";
      const productUrl = productText ? validUrl(productText) : null;
      if (productText && !productUrl) {
        feedback("쿠팡 상품 링크를 확인하거나 ‘없음’을 선택해 주세요.", true);
        productInput.focus();
        return;
      }
      const current = readStore();
      if (loadFailed) {
        feedback("기존 저장 내용을 읽을 수 없어요. 브라우저 저장 설정을 확인해 주세요.", true);
        return;
      }
      if (current.links.some((entry) => entry.category === category && entry.url === url.href)) {
        feedback("이 카테고리에 이미 저장된 링크예요.", true);
        return;
      }
      const number = (current.numbers[category] ?? 0) + 1;
      const id = crypto.randomUUID();
      const entry = { id, number, category, url: url.href, memo: "" };
      if (category === "쿠파스") entry.productUrl = productUrl?.href ?? null;
      const next = { ...current, numbers: { ...current.numbers, [category]: number }, links: [entry, ...current.links] };
      if (!save(next)) return;
      const address = current.autoSummary ? lookupUrl(url) : null;
      if (address) pending.add(id);
      if (active !== "전체") active = category;
      $("url").value = "";
      if (category === "쿠파스") {
        productInput.value = "";
        setProductNone(productInput, $("product-none"), false);
      }
      $("search").value = "";
      feedback(category + " " + number + "번에 저장했어요.");
      render();
      if (address) void summarize(id, address);
    });

    $("edit-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const current = readStore();
      const entry = current.links.find((item) => item.id === editing?.id);
      if (!entry) {
        $("edit-dialog").close();
        return;
      }
      const memo = $("memo-text").value.trim();
      const updated = memo !== editing.memo ? { ...entry, memo, memoEdited: true } : { ...entry };
      if (entry.category === "쿠파스") {
        const input = $("edit-product-url");
        const text = input.disabled ? "" : input.value.trim();
        const product = text ? validUrl(text) : null;
        if (text && !product) {
          $("edit-feedback").textContent = "쿠팡 상품 링크를 확인하거나 ‘없음’을 선택해 주세요.";
          input.focus();
          return;
        }
        updated.productUrl = product?.href ?? null;
      }
      const links = current.links.map((item) => item.id === entry.id ? updated : item);
      if (save({ ...current, links })) {
        $("edit-dialog").close();
        feedback("수정 내용을 저장했어요.");
        render();
      }
    });
    $("cancel-edit").addEventListener("click", () => $("edit-dialog").close());
    $("search").addEventListener("input", render);
    window.addEventListener("storage", (event) => {
      if (event.key === storeKey || event.key === null) {
        model = readStore();
        $("auto-summary").checked = model.autoSummary;
        renderTheme();
        render();
      }
    });

    if (loadFailed) feedback("이 브라우저에 저장된 링크를 읽지 못했어요.", true);
    const syncClient = document.querySelector('meta[name="google-sync-client-id"]').content;
    const driveSync = createDriveSync({
      clientId: syncClient,
      read: readStore,
      apply(next) {
        if (loadFailed || !save(next, true)) return false;
        render();
        return true;
      },
      show(state, message) {
        const button = $("drive-sync");
        button.disabled = state === "working";
        button.textContent = state === "working" ? "동기화 중" :
          model.driveSync?.account ? "동기화" : "Google Drive 연결";
        $("sync-status").textContent = message;
      },
    });
    if (syncClient && !loadFailed) {
      const googleScript = document.createElement("script");
      googleScript.src = "https://accounts.google.com/gsi/client";
      googleScript.async = true;
      document.head.append(googleScript);
      $("sync-controls").hidden = false;
      $("drive-sync").addEventListener("click", driveSync.connectOrSync);
      driveSync.start();
    }
    renderTheme();
    render();
  </script>
</body>
</html>
